<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Group Explorer: Groups of Fraleigh’s Abstract Algebra</title>
<style>
:root{--bg:#f6f4ee;--sf:#fff;--tx:#1d2233;--mu:#5d6478;--ac:#2f3fa8;--hi:#b45f06;--bd:#d9d5c8;--ok:#1b7a4b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12162a;--sf:#1b2040;--tx:#e8eaf6;--mu:#9aa2c4;--ac:#8fa2ff;--hi:#ffb454;--bd:#323a6b;--ok:#6fdc9f}}
:root[data-theme="dark"]{--bg:#12162a;--sf:#1b2040;--tx:#e8eaf6;--mu:#9aa2c4;--ac:#8fa2ff;--hi:#ffb454;--bd:#323a6b;--ok:#6fdc9f}
html{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Georgia,"Times New Roman",serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;margin:.2em 0 .1em;letter-spacing:-.01em}
.sub{color:var(--mu);margin:0 0 18px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
nav button{font:600 .9rem system-ui,sans-serif;padding:8px 14px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:6px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ac);color:var(--bg);border-color:var(--ac)}
button:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
section{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
label{font:.85rem system-ui,sans-serif;color:var(--mu);display:flex;flex-direction:column;gap:3px}
input{font:1rem ui-monospace,Menlo,monospace;padding:7px 9px;border:1px solid var(--bd);border-radius:5px;background:var(--bg);color:var(--tx);width:200px;max-width:100%}
.go{font:600 .95rem system-ui,sans-serif;padding:9px 16px;background:var(--hi);color:#fff;border:0;border-radius:6px;cursor:pointer}
.k{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.k div{border:1px solid var(--bd);border-radius:6px;padding:8px 12px;background:var(--bg)}
.k b{display:block;font-size:1.4rem;color:var(--ac)}
.k span{font:.8rem system-ui,sans-serif;color:var(--mu)}
.sc{overflow-x:auto;margin:8px 0}

th,td{border:1px solid var(--bd);padding:4px 8px;text-align:center;white-space:nowrap}

.bar{display:flex;align-items:center;gap:8px;font:.85rem ui-monospace,monospace;margin:3px 0}

.note{color:var(--mu);font-size:.92rem}

nav{flex-wrap:nowrap;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0;scrollbar-width:thin}

.sym{font:700 1.45rem Georgia,serif;color:var(--ac)}
.tags{display:flex;gap:4px;flex-wrap:wrap}.tags span{font:.72rem system-ui,sans-serif;padding:1px 8px;border:1px solid var(--bd);border-radius:99px;color:var(--mu)}

.tl th,.tl td{text-align:left;white-space:normal;font:.86rem/1.35 system-ui,sans-serif;vertical-align:top}.tl td:first-child{font:700 1.05rem Georgia,serif;color:var(--ac);white-space:nowrap}.tl .go{margin:0}
.def{border-left:4px solid var(--ac);padding:6px 12px;margin:8px 0;background:var(--bg);border-radius:0 6px 6px 0}.def b{color:var(--ac)}.def small{color:var(--mu);font:.75rem system-ui,sans-serif}

.xq{border:1px solid var(--bd);border-radius:8px;padding:12px 14px;margin:12px 0;background:var(--bg)}

.xq .row{margin:8px 0 4px;align-items:center}.xq input{width:150px}

.xq .go2{font:600 .85rem system-ui,sans-serif;padding:6px 10px;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:6px;cursor:pointer}
.xq .fb{font:600 .92rem system-ui,sans-serif}.xq .fb.y{color:var(--ok)}.xq .fb.n{color:var(--hi)}
.xq details{margin-top:6px}.xq summary{cursor:pointer;font:600 .88rem system-ui,sans-serif;color:var(--ac)}
.xq[data-ok="1"]{border-color:var(--ok)}
.score{position:sticky;top:46px;background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:6px 12px;font:600 .95rem system-ui,sans-serif;display:inline-block}
</style></head><body><main>
<h1>Group Explorer</h1>
<p class="sub">Every group and topic in Fraleigh–Brand, <i>A First Course in Abstract Algebra</i> (8th ed.): a filterable list of every group (abelian, cyclic, dihedral, permutation, …) and definitions, plus live explorers for abelian, permutation and dihedral groups.</p>
<nav role="tablist" id="tabs"></nav>
<section id="out"></section>
</main>
<script>
const $=s=>document.querySelector(s);
const gcd=(a,b)=>b?gcd(b,a%b):a, lcm=(a,b)=>a/gcd(a,b)*b;
const phi=n=>{let c=0;for(let k=1;k<=n;k++)if(gcd(k,n)==1)c++;return c};
function factor(n){const f={};for(let p=2;p*p<=n;p++)while(n%p==0){f[p]=(f[p]||0)+1;n/=p}if(n>1)f[n]=(f[n]||0)+1;return f}
function parts(n,max=n){if(n==0)return[[]];let r=[];for(let k=Math.min(n,max);k>=1;k--)for(const t of parts(n-k,k))r.push([k,...t]);return r}
const tex=a=>a.map(m=>"Z<sub>"+m+"</sub>").join(" × ")||"trivial";
const hist=(arr)=>{const h={};arr.forEach(o=>h[o]=(h[o]||0)+1);return h};
function histHTML(h){const mx=Math.max(...Object.values(h));return Object.keys(h).map(Number).sort((a,b)=>a-b).map(o=>`<div class="bar"><span style="width:70px">order ${o}</span><i style="width:${Math.max(4,h[o]/mx*220)}px"></i>${h[o]}</div>`).join("")}
function kp(a){return `<div class="k">${a.map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join("")}</div>`}

// ---- Abelian classification
function classify(n){
 const f=factor(n),ps=Object.keys(f).map(Number),opts=ps.map(p=>parts(f[p]));
 let combos=[[]];for(const o of opts)combos=combos.flatMap(c=>o.map(x=>[...c,x]));
 return [combos.map(c=>{const ed=[];c.forEach((pt,i)=>pt.forEach(e=>ed.push(ps[i]**e)));
  const L=Math.max(...c.map(p=>p.length),0),inv=[];
  for(let j=0;j<L;j++){let d=1;c.forEach((pt,i)=>{if(pt[j])d*=ps[i]**pt[j]});inv.push(d)}
  return{ed:ed.sort((a,b)=>a-b),inv:inv.reverse()}}),ps,f]}
function viewAbelian(){
 return `<div class="row"><label>Order n<input id="n" type="number" min="1" max="2000" value="72"></label><button class="go" id="b">Classify</button></div><div id="r"></div>
 <p class="note">Theorem: every finite abelian group is a product of cyclic groups. The number of groups of order n = ∏ p(a<sub>i</sub>), where n = ∏ p<sub>i</sub><sup>a<sub>i</sub></sup> and p(a) is the partition number.</p>`+rl("shift ciphers and rotating positions (Z<sub>n</sub>)",`<p><b>Problem.</b> A message must be encrypted by shifting letters, and a rotating sprinkler or camera must step through n positions without missing any.</p><p><b>Solution with Z<sub>n</sub>.</b> Letters are the elements of Z<sub>26</sub>. Encrypting with key k adds k mod 26, and decrypting adds the inverse 26 − k. For example HELLO with k = 3 becomes KHOOR, and k = 23 undoes it. A device that steps k positions around n positions visits every one exactly when gcd(k, n) = 1, which is why the generators of Z<sub>n</sub> listed above (φ(n) of them) are the only good step sizes.</p>`)}
function abTables(g,n){
 if(n>36)return `<h3>Cayley tables</h3><p class="note">Tables are shown for n ≤ 36 (a table has n² cells). Use the Z<sub>n</sub> product builder for larger groups.</p>`;
 return `<h3>Cayley table of every abelian group of order ${n}</h3>`+g.map((x,gi)=>{
  const m=x.inv.length?x.inv:[1];let els=[[]];for(const mi of m)els=els.flatMap(e=>[...Array(mi).keys()].map(v=>[...e,v]));
  const f=e=>m.length==1?""+e[0]:"("+e.join(",")+")",ord=e=>e.reduce((o,v,i)=>lcm(o,m[i]/gcd(m[i],v)),1);
  const add=(a,b)=>a.map((v,i)=>(v+b[i])%m[i]),ix=new Map(els.map((e,i)=>[e.join(),i])),os=els.map(ord);
  return `<h3 style="margin-top:22px">Group ${gi+1}: ${tex(x.inv)} <span class="note">(${Math.max(...os)==n?"cyclic":"non-cyclic"}, largest element order ${Math.max(...os)})</span></h3>`+
  `<div class="sc"><table><tr><th>+</th>${els.map(e=>`<th>${f(e)}</th>`).join("")}</tr>`+els.map(a=>`<tr><th>${f(a)}</th>${els.map(b=>`<td>${f(els[ix.get(add(a,b).join())])}</td>`).join("")}</tr>`).join("")+`</table></div>`+
  `<div>${histHTML(hist(os))}</div>`}).join("")}
function runAbelian(){
 const n=+$("#n").value;if(!(n>=1&&n<=2000)){$("#r").innerHTML="<p>Enter n between 1 and 2000.</p>";return}
 const[g,ps,f]=classify(n);
 const cnt=ps.map(p=>`p(${f[p]})`).join(" · ")||"1";
 $("#r").innerHTML=kp([[g.length,"abelian groups of order "+n],[phi(n),"generators of Z"+n+" (φ("+n+"))"]])+
 `<p class="note">n = ${ps.map(p=>p+(f[p]>1?"<sup>"+f[p]+"</sup>":"")).join(" · ")||1}, count = ${cnt}</p>`+
 `<div class="sc"><table><tr><th>#</th><th>Elementary divisors</th><th>Invariant factors (d<sub>1</sub> | d<sub>2</sub> | …)</th><th>Cyclic?</th></tr>`+
 g.map((x,i)=>`<tr><td>${i+1}</td><td>${tex(x.ed)}</td><td>${tex(x.inv)}</td><td>${x.inv.length<=1?"yes":"no"}</td></tr>`).join("")+`</table></div>`+abTables(g,n)+
 `<h3>Generators of Z<sub>${n}</sub></h3><p>${[...Array(n).keys()].filter(k=>gcd(k,n)==1||(n==1&&k==0)).join(", ")}</p>`+
 `<h3>φ(m) for m ≤ 20</h3><div class="sc"><table><tr><th>m</th>${[...Array(20)].map((_,i)=>`<td>${i+1}</td>`).join("")}</tr><tr><th>φ(m)</th>${[...Array(20)].map((_,i)=>`<td>${phi(i+1)}</td>`).join("")}</tr></table></div>`}

// ---- Builder Z_m1 x ... x Z_mk
function viewBuilder(){return `<div class="row"><label>Moduli (space separated)<input id="m" value="2 2"></label><button class="go" id="b">Build group</button></div><div id="r"></div>
<p class="note">Order of (x<sub>1</sub>,…,x<sub>k</sub>) = lcm of m<sub>i</sub>/gcd(m<sub>i</sub>,x<sub>i</sub>). Inverse = (−x<sub>i</sub> mod m<sub>i</sub>). Try "2 2" vs "4" to see Z<sub>2</sub>×Z<sub>2</sub> has no element of order 4.</p>`}
function runBuilder(){
 const m=$("#m").value.trim().split(/\s+/).map(Number).filter(x=>x>=1);
 const N=m.reduce((a,b)=>a*b,1);
 if(!m.length||N>4000){$("#r").innerHTML="<p>Use positive moduli with total order ≤ 4000.</p>";return}
 let els=[[]];for(const mi of m)els=els.flatMap(e=>[...Array(mi).keys()].map(x=>[...e,x]));
 const ord=e=>e.reduce((o,x,i)=>lcm(o,m[i]/gcd(m[i],x)),1);
 const os=els.map(ord),h=hist(os),cyc=Math.max(...os)==N;
 const f=e=>"("+e.join(",")+")";
 let html=kp([[N,"order of group"],[Math.max(...os),"largest element order"],[cyc?"yes":"no","cyclic?"]])+`<h3>Order histogram</h3>`+histHTML(h);
 if(N<=24){const add=(a,b)=>a.map((x,i)=>(x+b[i])%m[i]);const ix=e=>els.findIndex(z=>z.every((v,i)=>v==e[i]));
  html+=`<h3>Cayley table</h3><div class="sc"><table><tr><th>+</th>${els.map(e=>`<th>${f(e)}</th>`).join("")}</tr>`+els.map(a=>`<tr><th>${f(a)}</th>${els.map(b=>`<td>${f(add(a,b))}</td>`).join("")}</tr>`).join("")+`</table></div>`}
 html+=`<h3>Elements, orders and inverses</h3><div class="sc"><table><tr><th>element</th><th>order</th><th>inverse</th></tr>`+els.slice(0,200).map((e,i)=>`<tr><td>${f(e)}</td><td>${os[i]}</td><td>${f(e.map((x,j)=>(m[j]-x)%m[j]))}</td></tr>`).join("")+`</table></div>${N>200?'<p class="note">First 200 elements shown.</p>':""}`;
 $("#r").innerHTML=html}

// ---- Permutations
function cycles(p){const n=p.length,seen=Array(n).fill(0),c=[];for(let i=0;i<n;i++)if(!seen[i]){const cy=[];let j=i;while(!seen[j]){seen[j]=1;cy.push(j+1);j=p[j]}c.push(cy)}return c}
const pord=p=>cycles(p).reduce((o,c)=>lcm(o,c.length),1);
const psign=p=>((p.length-cycles(p).length)%2?-1:1);
function allPerms(n){if(n==1)return[[0]];const r=[];for(const q of allPerms(n-1))for(let i=0;i<=q.length;i++)r.push([...q.slice(0,i),n-1,...q.slice(i)]);return r}
function viewPerm(){return `<div class="row"><label>Permutation (one-line, images of 1..n)<input id="p" value="2 3 1 5 4"></label><button class="go" id="b">Analyse</button></div><div id="r"></div>
<h3>Whole group S<sub>n</sub></h3><div class="row"><label>n (1 to 7)<input id="sn" type="number" min="1" max="7" value="5" style="width:90px"></label><button class="go" id="b2">Split A<sub>n</sub> / odd</button></div><div id="r2"></div>
<p class="note">Order = lcm of cycle lengths. sign = (−1)<sup>n−c</sup>, c = number of cycles (including fixed points).</p>`+rl("shuffling and sorting (permutations)",`<p><b>Problem.</b> A warehouse conveyor or a card shuffler rearranges n items by a fixed rule. How many repeats bring the items back to the start, and can a sorting mistake be fixed by simple swaps?</p><p><b>Solution with S<sub>n</sub>.</b> The rule is a permutation. Split it into cycles: the number of repeats needed is the lcm of the cycle lengths (the order). Its inverse undoes it. Parity tells whether the rearrangement can be made with an even or odd number of swaps, so an odd arrangement can never be reached by even swaps alone, as in the 15-puzzle.</p>`)}
function runPerm(){
 const p=$("#p").value.trim().split(/[\s,]+/).map(Number),n=p.length;
 const ok=n>=1&&n<=12&&p.every(x=>x>=1&&x<=n)&&new Set(p).size==n;
 if(!ok){$("#r").innerHTML="<p>Enter each of 1…n exactly once (n ≤ 12), e.g. 2 3 1 5 4.</p>";return}
 const q=p.map(x=>x-1),cy=cycles(q),s=psign(q),inv=Array(n);q.forEach((x,i)=>inv[x]=i+1);
 $("#r").innerHTML=kp([[pord(q),"order"],[s>0?"even":"odd","parity (sign "+(s>0?"+1":"−1")+")"]])+
 `<p>Cycle decomposition: <b>${cy.filter(c=>c.length>1).map(c=>"("+c.join(" ")+")").join("")||"identity"}</b> &nbsp; lengths: ${cy.map(c=>c.length).join(", ")}</p><p>Inverse (one-line): ${inv.join(" ")}</p>`+`<p class="note">Real life: if this is a rule that rearranges ${n} parcels or cards, repeating it ${pord(q)} time${pord(q)>1?"s":""} restores the original order, and its inverse above undoes it in one pass.</p>`}
function runSn(){
 const n=+$("#sn").value;if(!(n>=1&&n<=7))return;
 const P=allPerms(n),ev=P.filter(p=>psign(p)>0).length,h=hist(P.map(pord)),he=hist(P.filter(p=>psign(p)>0).map(pord));
 $("#r2").innerHTML=kp([[P.length,"|S"+n+"| = n!"],[ev,"even permutations |A"+n+"|"],[P.length-ev,"odd permutations"]])+
 `<p class="note">${n>1?(ev==P.length/2?"Check: |A<sub>n</sub>| = n!/2 ✓":""):"A<sub>1</sub> = S<sub>1</sub>"}</p><h3>Order histogram of S<sub>${n}</sub></h3>${histHTML(h)}<h3>Order histogram of A<sub>${n}</sub></h3>${histHTML(he)}`}

// ---- Dihedral
function viewDih(){return `<div class="row"><label>n (3 to 24)<input id="d" type="number" min="3" max="24" value="6" style="width:90px"></label><button class="go" id="b">Build D<sub>n</sub></button></div><div id="r"></div>
<p class="note">D<sub>n</sub> = ⟨r,s | r<sup>n</sup> = s<sup>2</sup> = e, srs = r<sup>−1</sup>⟩, order 2n. Centre: {e, r<sup>n/2</sup>} if n is even, {e} if n is odd.</p>`+rl("wheels, gears and bolt patterns (D<sub>n</sub>)",`<p><b>Problem.</b> A wheel has n evenly spaced bolts, or a gear has n teeth. A robot must recognise the part whether it arrives turned or flipped over, and a designer wants to know how many different ways it can be mounted.</p><p><b>Solution with D<sub>n</sub>.</b> Turning the part is a rotation r<sup>k</sup>, flipping it is a reflection r<sup>k</sup>s, and together they give 2n mounting positions. Undoing a turn uses the inverse r<sup>n−k</sup>, and a flip is its own inverse. The centre shows which motions commute with all others, such as the half-turn when n is even. The Real life tab applies D<sub>4</sub> to square tiles.</p>`)}
function runDih(){
 const n=+$("#d").value;if(!(n>=3&&n<=24)){$("#r").innerHTML="<p>Use n from 3 to 24.</p>";return}
 const rot=[...Array(n).keys()].map(k=>({nm:k?"r"+(k>1?"<sup>"+k+"</sup>":""):"e",o:n/gcd(n,k),par:psign([...Array(n).keys()].map(i=>(i+k)%n)),inv:k?"r<sup>"+(n-k)+"</sup>":"e"}));
 const ref=[...Array(n).keys()].map(k=>({nm:"r"+(k?"<sup>"+k+"</sup>":"")+"s",o:2,par:psign([...Array(n).keys()].map(i=>((k-i)%n+n)%n)),inv:"r"+(k?"<sup>"+k+"</sup>":"")+"s"}));
 const all=[...rot,...ref],nEv=all.filter(x=>x.par>0).length,ctr=n%2?"{e}":"{e, r<sup>"+n/2+"</sup>}";
 $("#r").innerHTML=kp([[2*n,"|D"+n+"|"],[n,"rotations"],[n,"reflections"],[n%2?1:2,"|Z(D"+n+")|"],[nEv,"even permutations"],[2*n-nEv,"odd permutations"]])+`<p>Centre: <b>${ctr}</b></p><h3>Order histogram</h3>${histHTML(hist(all.map(x=>x.o)))}
 <h3>Elements</h3><div class="sc"><table><tr><th>element</th><th>type</th><th>order</th><th>inverse</th><th>even / odd</th></tr>${all.map((x,i)=>`<tr><td>${x.nm}</td><td>${i<n?"rotation":"reflection"}</td><td>${x.o}</td><td>${x.inv}</td><td class="${x.par>0?"ev":"od"}">${x.par>0?"even":"odd"}</td></tr>`).join("")}</table></div>
 <p class="note">Rotation r<sup>k</sup> has order n/gcd(n,k). Every reflection has order 2. Even/odd treats each element as a permutation of the n vertices: r<sup>k</sup> has sign (−1)<sup>n−gcd(n,k)</sup>.</p>`}

const rl=(t,b)=>`<div style="margin-top:18px;padding:12px 14px;border:1px solid var(--bd);border-left:4px solid var(--hi);border-radius:6px;background:var(--bg)"><h3 style="margin-top:0">Real-life problem: ${t}</h3>${b}</div>`;
function viewAll(){return `<p class="note">All four real-life problems in one place, each with its solution. The interactive tile demo is on its own tab.</p><button class="go" id="b" style="display:none" aria-hidden="true" tabindex="-1"></button>`+
rl("1. Tile inspection (D<sub>4</sub>)",`<p><b>Problem.</b> Square tiles reach the camera in different orientations. A machine vision system has trouble comparing a rotated or reflected tile with its reference design.</p><p><b>Solution.</b> The dihedral group D<sub>4</sub> holds the 4 rotations and 4 reflections of a square. The system tries each of the 8 elements on the tile and looks for a match with the reference. If tile = g(reference), the correction is the inverse g<sup>−1</sup>. If the pattern has its own symmetry, several corrections match, and the number of distinct orientations is 8 divided by the pattern’s symmetries.</p>`)+
rl("2. Shift ciphers and rotating positions (Z<sub>n</sub>)",`<p><b>Problem.</b> A message must be encrypted by shifting letters. A rotating sprinkler or camera must also step through n positions without missing any.</p><p><b>Solution.</b> Letters are the elements of Z<sub>26</sub>. Encrypting with key k adds k mod 26, and decrypting adds the inverse 26 − k. For example, HELLO with k = 3 becomes KHOOR, and k = 23 undoes it. A device stepping k positions around n positions visits every one exactly when gcd(k, n) = 1, so only the φ(n) generators of Z<sub>n</sub> are good step sizes.</p>`)+
rl("3. Shuffling and sorting (permutations, S<sub>n</sub>)",`<p><b>Problem.</b> A warehouse conveyor or card shuffler rearranges n items by a fixed rule. How many repeats bring the items back to the start, and can a mistake be fixed by simple swaps?</p><p><b>Solution.</b> The rule is a permutation. Split it into cycles, and the number of repeats needed is the lcm of the cycle lengths (its order). The inverse permutation undoes the rule in one pass. Parity tells whether the arrangement needs an even or odd number of swaps. An odd arrangement can never be reached by even swaps alone, as in the 15-puzzle.</p>`)+
rl("4. Wheels, gears and bolt patterns (D<sub>n</sub>)",`<p><b>Problem.</b> A wheel has n evenly spaced bolts, or a gear has n teeth. A robot must recognise the part whether it arrives turned or flipped, and a designer wants to know how many ways it can be mounted.</p><p><b>Solution.</b> A turn is a rotation r<sup>k</sup> and a flip is a reflection r<sup>k</sup>s, which together give 2n mounting positions. A turn is undone by the inverse r<sup>n−k</sup>, and a flip is its own inverse. The centre shows which motions commute with all others, such as the half-turn when n is even.</p>`)+
rl("How to solve them: worked examples",`<p>Method: write the situation as a group element, then use its inverse, its order or a match test.</p>
<h3>1. Tile (D<sub>4</sub>)</h3><ol><li>Take the 2×2 reference [[A, B], [C, D]].</li><li>The camera sees [[C, A], [D, B]], which is the reference turned 90° clockwise (r).</li><li>The system applies all 8 elements of D<sub>4</sub> to the camera image and compares each result with the reference.</li><li>r<sup>3</sup> gives [[A, B], [C, D]], a match. Since r<sup>3</sup> = r<sup>−1</sup>, the correction is the inverse of the turn.</li><li>If the tile were a reflection r<sup>k</sup>s, the correction is r<sup>k</sup>s itself.</li></ol>
<h3>2. Cipher and stepping (Z<sub>n</sub>)</h3><ol><li>Encrypt HELLO with k = 3: add 3 to each letter number mod 26 to get KHOOR.</li><li>Decrypt by adding the inverse 26 − 3 = 23. K (10) + 23 = 33, and 33 mod 26 = 7, which is H.</li><li>Stepping device with 12 positions and step 5: gcd(5, 12) = 1, so it visits all 12.</li><li>Step 4: gcd(4, 12) = 4, so it only visits 0, 4 and 8. Pick k from the generators of Z<sub>n</sub>.</li></ol>
<h3>3. Shuffle (S<sub>n</sub>)</h3><ol><li>Write the rule in one line: 2 3 1 5 4.</li><li>Cycles: (1 2 3)(4 5), with lengths 3 and 2.</li><li>Repeats to restore the order: lcm(3, 2) = 6.</li><li>Inverse, which undoes it in one pass: 3 1 2 5 4.</li><li>Parity: n − c = 5 − 2 = 3, which is odd, so it needs an odd number of swaps.</li></ol>
<h3>4. Wheel (D<sub>n</sub>)</h3><ol><li>A 5-bolt wheel has symmetry group D<sub>5</sub> with 2 × 5 = 10 elements.</li><li>If it arrives turned by 2 bolt positions (r<sup>2</sup>), the correction is r<sup>5−2</sup> = r<sup>3</sup>.</li><li>If it arrives flipped as rs, the correction is rs again.</li><li>For a 6-bolt wheel, the half-turn r<sup>3</sup> commutes with every motion, so it is the centre of D<sub>6</sub>.</li></ol>`)}
function runReport(){
 let h="";const bad=t=>`<p>${t}</p>`;
 const n=+$("#r1").value;
 if(n>=1&&n<=2000){const [g]=classify(n);h+=`<p><b>1.</b> Order ${n}: <b>${g.length}</b> abelian group structure${g.length>1?"s":""}: ${g.map(x=>tex(x.ed)).join("; ")}.</p>`}else h+=bad("<b>1.</b> Use n from 1 to 2000.");
 const m=$("#r2").value.trim().split(/\s+/).map(Number).filter(x=>x>=1),N=m.reduce((a,b)=>a*b,1);
 if(m.length&&N<=4000){let els=[[]];for(const mi of m)els=els.flatMap(e=>[...Array(mi).keys()].map(x=>[...e,x]));const mx=Math.max(...els.map(e=>e.reduce((o,x,i)=>lcm(o,m[i]/gcd(m[i],x)),1)));h+=`<p><b>2.</b> ${tex(m)}: <b>${N}</b> elements, largest element order <b>${mx}</b>, <b>${mx==N?"cyclic":"non-cyclic"}</b>.</p>`}else h+=bad("<b>2.</b> Use positive moduli with total order ≤ 4000.");
 const p=$("#r3").value.trim().split(/[\s,]+/).map(Number),pn=p.length;
 if(pn>=1&&pn<=12&&p.every(x=>x>=1&&x<=pn)&&new Set(p).size==pn){const q=p.map(x=>x-1),cy=cycles(q).filter(c=>c.length>1).map(c=>"("+c.join(" ")+")").join("")||"identity";h+=`<p><b>3.</b> σ = <b>${cy}</b>, order <b>${pord(q)}</b>, ${psign(q)>0?"even":"odd"} permutation.</p>`}else h+=bad("<b>3.</b> Enter each of 1…n exactly once (n ≤ 12).");
 const d=+$("#r4").value;
 if(d>=3&&d<=24)h+=`<p><b>4.</b> D<sub>${d}</sub>: <b>${2*d}</b> symmetries, <b>${d}</b> rotations and <b>${d}</b> reflections.</p>`;else h+=bad("<b>4.</b> Use n from 3 to 24.");
 $("#r").innerHTML=h}

<h3>Limitations</h3><ul>

function runTile(){

 $("#r").innerHTML=`<h3>1. Reference design (click a cell to recolour)</h3><div style="display:grid;grid-template-columns:repeat(3,56px);gap:2px">${PAT.map((r,i)=>r.map((v,j)=>`<button class="cell" data-i="${i}" data-j="${j}" aria-label="cell ${i+1},${j+1}" style="width:56px;height:56px;border:1px solid var(--bd);background:${COL[v]};cursor:pointer"></button>`).join("")).join("")}</div>`+
 `<h3>2. Camera sees ${dn(k,f)}(reference); the system applies ${dn(ik,iF)}</h3><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">${svg(PAT)}<span>${dn(k,f)} →</span>${svg(tile)}<span>${dn(ik,iF)} →</span>${svg(app(ik,iF,tile))}</div>`+
 kp([[dn(ik,iF),"correction g⁻¹"],[fix.length,"corrections that match"],[orb,"distinct orientations (of 8)"]])+
 `<p>Matching transformations: ${fix.map(([a,b])=>dn(a,b)).join(", ")}. ${fix.length==1?"The pattern has no symmetry, so the correction is unique.":"The pattern has symmetry, so several corrections work."}</p>`+
 `<h3>All 8 orientations of the reference</h3><div style="display:flex;gap:10px;flex-wrap:wrap">${ALL.map(([a,b])=>`<div style="text-align:center;font:.8rem ui-monospace,monospace">${svg(app(a,b,PAT),72)}<br>${dn(a,b)}</div>`).join("")}</div>`+
 `<p class="note">Orbit–stabiliser: distinct orientations = 8 ÷ (symmetries of the pattern) = ${orb}. Try colouring all cells the same.</p>`;

["Binary operation","A rule that combines two elements of a set S and gives an element of S.","1"],

["Abelian group","A group whose operation is commutative.","2.3"],
["Isomorphism","A one-to-one onto map f: G₁ → G₂ with f(ab) = f(a)f(b). Isomorphic groups have the same structure.","2.22"],
["Group table rule","In a group table every element appears exactly once in each row and each column, and e appears in every row and column.","2"],
["Cancellation, uniqueness","ab = ac ⇒ b = c. The identity and each inverse are unique, (ab)⁻¹ = b⁻¹a⁻¹, and ax = b has the unique solution x = a⁻¹b.","2.16–2.19"],
["Order of a group","The number of elements of G, written |G|.","4.3"],

["Cyclic subgroup, generator","⟨a⟩ = {aⁿ : n ∈ ℤ} is the smallest subgroup containing a. G is cyclic if G = ⟨a⟩ for some a.","5.20, 5.22"],
["Cyclic group facts","Cyclic ⇒ abelian. Subgroups of cyclic groups are cyclic. Infinite cyclic ≅ ℤ; order n ≅ ℤ<sub>n</sub>. Generators are aʳ with gcd(r, n) = 1.","6.1–6.17"],
["gcd and lcm","gcd(r, s) generates {nr + ms}. The lcm generates the common multiples. The order of (a₁,…,aₖ) in a product is the lcm of the orders.","6.8, 9.8, 9.9"],
["Generating set","The smallest subgroup containing a set {aᵢ}. G is finitely generated if a finite set generates it.","7.6"],
["Cayley digraph","A drawing of G with vertices the elements and labelled arrows for multiplication by each generator.","7"],
["Homomorphism, kernel","φ(ab) = φ(a)φ(b). Ker φ = {x : φ(x) = e′}. φ is one-to-one iff Ker φ = {e}.","8.1, 8.6, 10.19"],
["Permutation, Sₙ","A one-to-one onto map A → A. The permutations of {1,…,n} form the symmetric group Sₙ of order n!.","4.6, 4.9"],
["Cycle, transposition","A k-cycle moves k numbers around a loop; a 2-cycle is a transposition. Disjoint cycles commute and every permutation is a product of them.","4, 8.14"],
["Even / odd, Aₙ","Even or odd by the parity of the number of transpositions (never both). The even ones form Aₙ of order n!/2.","8.22–8.25"],
["Cayley’s theorem","Every group is isomorphic to a group of permutations, via x ↦ λₓ, λₓ(g) = xg.","8.10, 8.11"],
["Dihedral group Dₙ","Symmetries of a regular n-gon, order 2n, with ρⁿ = μ² = ι and ρμ = μρⁿ⁻¹. Every μρᵏ has order 2.","4.16–4.22"],
["Direct product","G₁ × … × Gₙ with componentwise operation. ℤ<sub>m</sub> × ℤ<sub>n</sub> ≅ ℤ<sub>mn</sub> iff gcd(m, n) = 1.","9.1, 9.5"],
["Fundamental theorem","Every finitely generated abelian group is a product of cyclic groups: prime-power form (9.12) or invariant-factor form d₁ | d₂ | … (9.14).","9.12, 9.14"],
["Indecomposable","Not isomorphic to a product of two proper nontrivial subgroups. Finite abelian ones are the cyclic groups of prime-power order.","9.17, 9.18"],
["Left coset, index","aH = {ah : h ∈ H}. The index (G : H) is the number of left cosets.","10.2, 10.10"],
["Lagrange’s theorem","For finite G and H ≤ G, |H| divides |G|, so |G| = (G : H)|H|. A group of prime order is cyclic.","10.7, 10.8"],
["Isometry","A distance-preserving map of the plane. The isometries form a group under composition.","2.13, 11"],
["Normal subgroup","H ⊴ G when gH = Hg for all g, equivalently ghg⁻¹ ∈ H, or H is the kernel of a homomorphism.","12.3, 12.17"],
["Factor group G/H","For H normal, the cosets under (aH)(bH) = (ab)H. The map x ↦ xH is a homomorphism with kernel H.","12.8–12.12"],
["Automorphism, conjugation","An isomorphism G → G. Conjugation by g, x ↦ gxg⁻¹, is the inner automorphism.","12.19"],
["Simple group","Nontrivial with no proper nontrivial normal subgroup. Aₙ is simple for n ≥ 5; G/M is simple iff M is maximal normal.","13.16–13.20"],
["Commutator subgroup","Generated by all aba⁻¹b⁻¹. It is normal, and G/N is abelian iff it lies in N.","13.22"],
["Homomorphism properties","φ(e) = e′, φ(a⁻¹) = φ(a)⁻¹. The image φ[G] is a subgroup of G′, the preimage of a subgroup is a subgroup, and the preimage of a normal subgroup is normal. Ker φ ⊴ G.","13"],
["Fundamental homomorphism theorem (First isomorphism theorem)","If φ: G → G′ is a homomorphism with kernel K, then G/K ≅ φ[G] via gK ↦ φ(g). Every normal subgroup is the kernel of x ↦ xH.","14, 34"],
["Second isomorphism theorem","For H ≤ G and N ⊴ G: HN ≤ G, H ∩ N ⊴ H, and HN/N ≅ H/(H ∩ N).","34"],
["Third isomorphism theorem","If K ⊴ G, H ⊴ G and K ≤ H, then (G/K)/(H/K) ≅ G/H.","34"],
["Correspondence theorem","For N ⊴ G, subgroups of G containing N correspond one-to-one with subgroups of G/N via H ↦ H/N, and normal ones correspond to normal ones.","34"],
["Center, centralizer, normalizer","Z(G) = {z : zg = gz for all g}. C(a) = {g : ga = ag}. N(H) = {g : gHg⁻¹ = H}, the largest subgroup in which H is normal. H ⊴ G iff N(H) = G.","15, 36"],
["Automorphisms Aut(G), Inn(G)","Aut(G) is the group of isomorphisms G → G. Inn(G) = {conjugations} ⊴ Aut(G), and Inn(G) ≅ G/Z(G).","14, 15"],
["Group action, G-set","A set X with gx ∈ X, ex = x and (g₁g₂)x = g₁(g₂x). Orbit Gx, stabilizer G<sub>x</sub> = {g : gx = x}. |Gx| = (G : G<sub>x</sub>).","16"],
["Burnside’s formula","The number of orbits of X under G is (1/|G|) Σ<sub>g</sub> |X<sub>g</sub>|, where X<sub>g</sub> = the points fixed by g. Used to count colourings and necklaces.","17"],
["Class equation, p-groups","|G| = |Z(G)| + Σ(G : C(a<sub>i</sub>)), one a<sub>i</sub> per non-central class. A p-group (order pⁿ) has a nontrivial center, and is solvable.","16, 37"],
["Cauchy’s theorem","If a prime p divides |G|, then G has an element (so a subgroup) of order p.","36"],
["Sylow p-subgroup","A subgroup of maximal prime-power order pᵏ, where |G| = pᵏm and p ∤ m.","36"],
["First Sylow theorem","If pⁱ divides |G|, then G has a subgroup of order pⁱ. In particular a Sylow p-subgroup exists for every prime p.","36"],
["Second Sylow theorem","Any two Sylow p-subgroups of G are conjugate.","36"],
["Third Sylow theorem","For |G| = pᵏm with p ∤ m, the number n<sub>p</sub> of Sylow p-subgroups satisfies n<sub>p</sub> ≡ 1 (mod p) and n<sub>p</sub> divides m. n<sub>p</sub> = 1 iff the Sylow p-subgroup is normal.","36"],
["Using Sylow theory","If |G| = pq with p < q and p ∤ q − 1, then G is cyclic (so every group of order 15 is ℤ₁₅). Showing some n<sub>p</sub> = 1 gives a proper normal subgroup, so G is not simple (e.g. orders 20, 30, 56, 100).","37"],
["Normal and subnormal series","Subnormal: G = H₀ ≥ H₁ ≥ … ≥ H<sub>n</sub> = {e} with each H<sub>i+1</sub> ⊴ H<sub>i</sub>. Normal series: each H<sub>i</sub> ⊴ G. The factor groups are H<sub>i</sub>/H<sub>i+1</sub>.","35"],
["Refinement, equivalent series","A refinement inserts extra terms. Two series are equivalent if their factor groups match up to isomorphism after reordering.","35"],
["Zassenhaus lemma, Schreier theorem","Zassenhaus (butterfly) lemma compares two subgroup chains. Schreier: any two subnormal (normal) series of G have equivalent refinements.","34, 35"],
["Composition series, Jordan–Hölder","A subnormal series with no proper refinement, so every factor is simple. Jordan–Hölder: any two composition series of G are equivalent. ℤ has none. A finite group always has one.","35"],
["Principal (chief) series","A normal series that has no proper refinement as a normal series.","35"],
["Solvable group","G has a subnormal series with abelian factors, equivalently all composition factors are cyclic of prime order. Abelian groups, p-groups and S₃, S₄ are solvable. S<sub>n</sub> and A<sub>n</sub> (n ≥ 5) are not.","35"],
["Free abelian group, basis","A group isomorphic to ℤ × … × ℤ (r copies). It has a basis {b₁,…,b<sub>r</sub>} so each element is uniquely Σ n<sub>i</sub>b<sub>i</sub>. The rank r is unique.","38"],
["Free abelian groups: facts","A subgroup of a free abelian group of rank r is free abelian of rank ≤ r. A finitely generated abelian group is ℤʳ × (finite group), where r is the Betti number.","38, 11"],
["Free group F[A]","Reduced words in letters aᵢ and aᵢ⁻¹ on a set A, with concatenation and cancellation. If A has one letter, F ≅ ℤ. Every subgroup of a free group is free.","39"],
["Universal property of free groups","Any map from A to a group G extends uniquely to a homomorphism F[A] → G. Hence every group is a homomorphic image of a free group.","39"],
["Group presentation ⟨A | R⟩","The group F[A]/N, where N is the normal closure of the relators R. Examples: ℤ<sub>n</sub> = ⟨a | aⁿ⟩, ℤ×ℤ = ⟨a, b | ab = ba⟩, D<sub>n</sub> = ⟨r, s | rⁿ, s², srs = r⁻¹⟩.","40"],
["Von Dyck, finitely presented","If G is generated by a set whose elements satisfy the relations R, then G is a homomorphic image of ⟨A | R⟩. A group is finitely presented if A and R are finite. Deciding whether two presentations are isomorphic has no general algorithm.","40"],
["Maximal normal subgroup","M ⊴ G, M ≠ G, with no normal N between M and G. G/M is simple iff M is maximal normal.","15"]
];
const CF=new Set(),LBL={cyc:"cyclic",dih:"dihedral",perm:"permutation",mat:"matrix",prod:"direct product",unit:"units / fields",gal:"Galois",num:"number group",free:"free / presented",ord:"by order",thy:"theory"};
let CV="list";
const plain=h=>h.replace(/<[^>]+>/g,"").toLowerCase();
const ABL={ab:"abelian",non:"nonabelian",both:"abelian only for small n"};
const TR=[["cyc",/^(ℤn|un|nℤ|\{e\}|g\(gf)/],["dih",/^dn$/],["perm",/^(sn|an|a5|cube|s5)/],["mat",/^(gl|sl|o\(n\)|ℍ|ℝⁿ)/],["prod",/^(ℤm|ℤ ×|v \()/],["unit",/^(u\(n\)|u\(r\)|f\*)/],["gal",/^(g\(|aut\(e\))/],["num",/^(ℤ, ℚ|nℤ|ℚ⁺|\(ℚ⁺|ℝc|u$|f\(ℝ\))/],["free",/^(f\[a\]|⟨a|ℤʳ|ℤ × ℤ, ℤʳ)/],["ord",/^groups of order/],["thy",/^(z\(g\)|aut\(g\)|g\/h|simple|solvable|sylow|p-groups|finite abelian|\(r, \+\)|ℤ-modules)/]];
function tagsOf(g){if(g[10])return g[10].split(" ");const s=plain(g[0]);return TR.filter(([k,r])=>r.test(s)).map(x=>x[0])}
function matches(g,k){return k=="fin"?!!g[2]:k=="inf"?!g[2]:k=="ab"||k=="non"||k=="both"?g[3]==k:tagsOf(g).includes(k)}
function viewCat(){return `<p class="note">Pick one or more filters to find groups (filters combine, for example <b>Finite + Abelian + Cyclic</b>). Type in the search box to look for a name, symbol, order or section.</p><div class="row"><label>Search groups<input id="q" placeholder="dihedral, order, 2.14…"></label><div id="views" role="group" aria-label="View"></div></div><div id="chips" role="group" aria-label="Filters" style="margin-bottom:8px"></div><button class="go" id="b" style="display:none" aria-hidden="true" tabindex="-1"></button><p class="note" id="cnt"></p><div id="cat"></div><p class="note">Section numbers refer to Fraleigh–Brand, 8th edition. “Explore live” opens the matching calculator. “Abelian” means always abelian; “abelian only for small n” means it depends on n (for example S<sub>n</sub>, GL(n, ℝ)).</p>`}
function runCat(){
 const F=[["fin","Finite"],["inf","Infinite"],["ab","Abelian"],["non","Nonabelian"],["both","Abelian only for small n"],["cyc","Cyclic"],["dih","Dihedral"],["perm","Permutation (Sₙ, Aₙ…)"],["prod","Direct products"],["unit","Units & fields"],["mat","Matrix groups"],["gal","Galois groups"],["num","Number groups"],["free","Free & presented"],["ord","Groups of a given order"],["thy","General theory"]],q=$("#q").value.toLowerCase();
 $("#chips").innerHTML=`<button class="chip" aria-pressed="${CF.size==0}" data-k="all">All</button>`+F.map(([k,l])=>`<button class="chip" aria-pressed="${CF.has(k)}" data-k="${k}">${l}</button>`).join("");
 $("#views").innerHTML=[["list","List"],["cards","Cards"]].map(([k,l])=>`<button class="chip" aria-pressed="${CV==k}" data-v="${k}">${l} view</button>`).join("");
 document.querySelectorAll("#chips .chip").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k=="all")CF.clear();else CF.has(k)?CF.delete(k):CF.add(k);runCat()});
 document.querySelectorAll("#views .chip").forEach(b=>b.onclick=()=>{CV=b.dataset.v;runCat()});
 $("#q").oninput=runCat;
 const L=G.filter(g=>[...CF].every(k=>matches(g,k))&&plain(g.join(" ")).includes(q));
 $("#cnt").textContent=L.length+" of "+G.length+" groups";
 const ex=g=>g[8]>=0?`<button class="go sm" data-t="${g[8]}"${g[9]?` data-p='${JSON.stringify(g[9])}'`:""}>Explore live</button>`:"",tg=g=>tagsOf(g).map(t=>LBL[t]).join(", ")||"—";

function viewEuler(){return `<h3>Euler group U(n) = (ℤ/nℤ)<sup>×</sup></h3><div class="row"><label>n (1 to 500)<input id="en" type="number" min="1" max="500" value="15" style="width:110px"></label><button class="go" id="b">Build U(n)</button></div><div id="r"></div>
<p class="note">U(n) = {a mod n : gcd(a, n) = 1} under multiplication mod n. Its order is Euler’s φ(n), so Euler’s theorem a<sup>φ(n)</sup> ≡ 1 (mod n) is just Lagrange’s theorem. U(n) is cyclic exactly when n = 1, 2, 4, p<sup>k</sup> or 2p<sup>k</sup> (p an odd prime); a generator is then a <i>primitive root</i>.</p>
<h3>Other small groups</h3><div class="row"><label>Group<select id="og" style="font:1rem system-ui;padding:7px;border:1px solid var(--bd);border-radius:5px;background:var(--bg);color:var(--tx)"><option value="Q8">Quaternion group Q₈</option><option value="S3">S₃</option><option value="D4">D₄ (symmetries of a square)</option><option value="A4">A₄</option><option value="S4">S₄</option><option value="Z7Z3">ℤ₇ ⋊ ℤ₃ (order 21)</option><option value="Cube">Rotations of a cube (order 24)</option><option value="A5">A₅ (order 60)</option></select></label><button class="go" id="b2">Show group</button></div><div id="r2"></div>

<p class="note">Write n = pᵏ·m with p ∤ m. Third Sylow theorem: n<sub>p</sub> divides m and n<sub>p</sub> ≡ 1 (mod p). If only one value is possible, that Sylow subgroup is normal, so G is not simple (when n is not prime). First Sylow theorem: G has a subgroup of every order pⁱ dividing n.</p>
